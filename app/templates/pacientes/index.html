{% extends "base.html" %}
{% block title %}Pacientes{% endblock %}
{% block content %}
<div class="d-flex justify-content-between mb-3">
    <h2>Pacientes</h2>
    <a href="{{ url_for('bp_pacientes.crear') }}" class="btn btn-success">+ Nuevo Paciente</a>
</div>

<table class="table table-striped bg-white">
    <thead class="table-primary">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Teléfono</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for p in pacientes %}
        <tr>
            <td>{{ p.id }}</td>
            <td>{{ p.nombre }}</td>
            <td>{{ p.telefono }}</td>
            <td>
                <a href="{{ url_for('bp_pacientes.editar', id=p.id) }}" class="btn btn-sm btn-warning">Editar</a>
                <form method="POST" action="{{ url_for('bp_pacientes.eliminar', id=p.id) }}" class="d-inline">
                    <button class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar?')">Eliminar</button>
                </form>
            </td>
        </tr>
        {% else %}
        <tr><td colspan="4" class="text-center">No hay pacientes registrados.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
